services:
  - type: web
    name: pulseapi-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements/prod.txt && python manage.py collectstatic --no-input"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: DATABASE_URL
        sync: false  # Provide Neon PostgreSQL connection URL in Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.0
