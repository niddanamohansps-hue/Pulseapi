services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseapi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseapi}
      POSTGRES_USER: ${POSTGRES_USER:-pulseapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseapi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseapi} -d ${POSTGRES_DB:-pulseapi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
